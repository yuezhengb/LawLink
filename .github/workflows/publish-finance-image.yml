name: Publish LawLink finance preview image

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/yuezhengb/lawlink-finance
      PREPROCESSOR_IMAGE: ghcr.io/yuezhengb/lawlink-finance-preprocessor
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Build isolated finance preprocessor image
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$PREPROCESSOR_IMAGE:$GITHUB_SHA" \
            services/finance-preprocessor

      - name: Smoke-test private finance preprocessor
        run: |
          set -euo pipefail
          CONTAINER=lawlink-finance-preprocessor-smoke
          cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --network none --name "$CONTAINER" \
            -e FINANCE_PREPROCESSOR_TOKEN=ci-only-preprocessor-token \
            "$PREPROCESSOR_IMAGE:$GITHUB_SHA" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$CONTAINER" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2).read()' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Finance preprocessor health check failed"
          docker logs "$CONTAINER" 2>/dev/null | tail -n 20
          exit 1

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" .

      - name: Smoke-test migrations and seed in runtime image
        run: |
          set -euo pipefail
          NETWORK=lawlink-finance-image-smoke
          DB=lawlink-finance-image-smoke-db
          docker network create "$NETWORK"
          cleanup() {
            docker rm -f "$DB" >/dev/null 2>&1 || true
            docker network rm "$NETWORK" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$DB" --network "$NETWORK" \
            -e POSTGRES_USER=lawlink \
            -e POSTGRES_PASSWORD=lawlink \
            -e POSTGRES_DB=lawlink \
            postgres:16-alpine

          for attempt in $(seq 1 30); do
            if docker exec "$DB" pg_isready -U lawlink -d lawlink >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$DB" pg_isready -U lawlink -d lawlink

          run_prisma() {
            docker run --rm --network "$NETWORK" \
              -e DATABASE_URL='postgresql://lawlink:lawlink@lawlink-finance-image-smoke-db:5432/lawlink?schema=public' \
              -e NEXTAUTH_URL=http://localhost:3000 \
              -e NEXTAUTH_SECRET=ci-only-nextauth-secret-not-for-deployments \
              -e STORAGE_ENCRYPTION_KEY=Y2ktb25seS1rZXktbm90LWZvci1kZXBsb3ltZW50cyE= \
              -e SEED_ADMIN_EMAIL=finance-image-smoke@lawlink.local \
              -e SEED_ADMIN_PASSWORD=SmokeOnly_2026! \
              -e APP_STORAGE_DIR=/app/storage \
              "$IMAGE:$GITHUB_SHA" "$@"
          }
          run_prisma npx prisma migrate deploy
          run_prisma npx prisma db seed

      - name: Publish image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$PREPROCESSOR_IMAGE:$GITHUB_SHA"
          printf 'Published private finance images for commit `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
